<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Garbage In, Refund Out: final report</title>
<style>
  @page { size: Letter; margin: 12mm 13mm; }
  :root { --ink:#0b0b0b; --ink2:#52514e; --rule:#e4e3df; --blue:#2a78d6; --green:#1a7f4b; --red:#b42318; --amber:#9a6700; }
  body { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); font-size: 9.3pt; line-height: 1.36; margin: 0; background: #fff; }
  h1 { font-size: 16.5pt; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 11.8pt; margin: 14px 0 5px; border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
  h3 { font-size: 11pt; margin: 8px 0 4px; }
  .meta { color: var(--ink2); font-size: 8.8pt; margin-bottom: 8px; }
  .box { border: 1px solid var(--rule); border-left: 4px solid var(--blue); padding: 7px 10px; margin: 7px 0; background: #fafaf8; }
  table { border-collapse: collapse; width: 100%; font-size: 7.9pt; margin: 5px 0 3px; }
  th, td { border-bottom: 1px solid var(--rule); padding: 2.5px 4px; text-align: left; vertical-align: top; }
  th { color: var(--ink2); font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ok { color: var(--green); font-weight: 600; } .no { color: var(--red); font-weight: 600; } .mid { color: var(--amber); font-weight: 600; }
  img { width: 100%; } img.half { width: 64%; display:block; margin: 0 auto; }
  .small { font-size: 8.3pt; color: var(--ink2); }
  ul { margin: 3px 0 3px 18px; padding: 0; } li { margin: 1.5px 0; }
  .web { border: 1px solid var(--rule); padding: 2px 11px; font-size: 8.7pt; line-height: 1.35; } .web ul { margin: 2px 0 2px 16px; } .web p { margin: 4px 0; }
  .pb { page-break-before: always; }
</style></head><body>
{{BODY}}
</body></html>
